function backToList(){ state.view="list"; render(); }
function openCart(){ state.tab="home"; state.view="cart"; render(); }

function bottomNavHTML(){
  if (state.role==="umkm") return umkmBottomNavHTML();
  if (state.view==="detail" || state.view==="success" || state.view==="qr" || state.view==="va" || state.view==="vaBank" || state.view==="cash" || state.view==="complaint") return "";
  const items = [
    {key:"home", label:"Beranda", icon:ICONS.home},
    {key:"orders", label:"Pesanan", icon:ICONS.receipt},
    {key:"profile", label:"Profil", icon:ICONS.user},
  ];
  return `<div class="bottom-nav">
    ${items.map(i=>{
      const active = state.tab===i.key && (i.key!=="home" || state.view==="list");
      return `<button class="nav-btn ${active?'active':''}" onclick="setTab('${i.key}')">${i.icon}<span>${i.label}</span></button>`;
    }).join("")}
  </div>`;
}

/* ---------------- main render ---------------- */
function bodyHTML(){
  if (state.role==="umkm") return umkmBodyHTML();
  if (state.view==="qr") return qrHTML();
  if (state.view==="vaBank") return vaBankHTML();
  if (state.view==="va") return vaHTML();
  if (state.view==="cash") return cashHTML();
  if (state.view==="complaint") return complaintHTML();
  if (state.view==="cart") return cartHTML();
  if (state.view==="success") return successHTML();
  if (state.view==="detail") return detailHTML();
  if (state.view==="tierInfo") return consumerTierHTML(state.tierInfoKind);
  if (state.view==="tierItemDetail") return tierItemDetailHTML();
  if (state.tab==="orders") return ordersHTML();
  if (state.tab==="profile") return profileHTML();
  if (state.tab==="home" && state.view==="list" && !state.locationEnabled) return locationGateHTML();
  return homeListHTML();
}

function render(){
  if (state.role==="umkm"){
    if (!state.umkmAuth.loggedIn){
      el("app").innerHTML = mitraAuthHTML();
      wireMitraAuthInputs();
      return;
    }
  } else if (!state.auth.loggedIn){
    el("app").innerHTML = authHTML();
    wireAuthInputs();
    return;
  }
  el("app").innerHTML = `
    <div class="topbar">${topBarHTML()}</div>
    <div class="content">${bodyHTML()}</div>
    ${bottomNavHTML()}
  `;
  // wire up inputs that need live events (rebuilt each render)
  const si = el("searchInput");
  if (si) si.addEventListener("input", e => {
    state.query = e.target.value;
    const w=el("dealListWrap");
    if (w && !state.mapMode) w.innerHTML = dealListInnerHTML(); // cukup perbarui daftar, input tidak ikut digambar ulang
    else { render(); preserveFocus("searchInput"); }
  });
  const ri = el("radiusInput");
  if (ri) ri.addEventListener("input", e => { state.radius = parseFloat(e.target.value); render(); });
  wireUmkmInputs();
  wireComplaintInputs();
  wireAddAddressInputs();
  lmSync();
  aaSync();
  postRender();
}

// wire up the "tambah alamat" fields (rebuilt each render)
function wireAddAddressInputs(){
  const ad = el("aaDetailInput");
  if (ad) ad.addEventListener("input", e => { AA.address = e.target.value; });
  const al = el("aaCustomLabel");
  if (al) al.addEventListener("input", e => { AA.customLabel = e.target.value; });
}

// wire up the complaint note textarea (rebuilt each render)
function wireComplaintInputs(){
  const cn = el("complaintNoteInput");
  if (cn) cn.addEventListener("input", e => { state.complaintForm.note = e.target.value; });
}

// wire up the UMKM surplus-form fields (rebuilt each render)
function wireUmkmInputs(){
  const un = el("umkmNamaInput");
  if (un) un.addEventListener("input", e => { state.umkmForm.nama = e.target.value; });
  const uj = el("umkmJumlahInput");
  if (uj) uj.addEventListener("input", e => { const v=e.target.value.replace(/\D/g,""); if(v!==e.target.value) e.target.value=v; state.umkmForm.jumlah = v; });
  const uv = el("umkmNilaiInput");
  if (uv) uv.addEventListener("input", e => { const v=e.target.value.replace(/\D/g,""); if(v!==e.target.value) e.target.value=v; state.umkmForm.nilaiSatuan = v; });
  // form edit surplus tercatat
  const en = el("editNama"); if (en) en.addEventListener("input", e => setEditField("nama", e.target.value));
  const ej = el("editJumlah"); if (ej) ej.addEventListener("input", e => { const v=e.target.value.replace(/\D/g,""); if(v!==e.target.value) e.target.value=v; setEditField("jumlah", v); });
  const ev = el("editNilai"); if (ev) ev.addEventListener("input", e => { const v=e.target.value.replace(/\D/g,""); if(v!==e.target.value) e.target.value=v; setEditField("nilaiSatuan", v); });

}

// wire up the Mitra UMKM login/daftar form fields (rebuilt each render)
function wireMitraAuthInputs(){
  // catatan: field login/daftar TIDAK perlu render() ulang tiap ketikan —
  // tidak ada tampilan lain yang bergantung pada nilai ini saat mengetik,
  // jadi render ulang cuma bikin kotak input hilang-fokus di keyboard HP.
  const an = el("mitraAuthName");
  if (an) an.addEventListener("input", e => { state.umkmAuth.name = e.target.value; });
  const ae = el("mitraAuthEmail");
  if (ae) ae.addEventListener("input", e => { state.umkmAuth.email = e.target.value; });
  const ap = el("mitraAuthPassword");
  if (ap){
    ap.addEventListener("input", e => { state.umkmAuth.password = e.target.value; });
    ap.addEventListener("keydown", e => { if (e.key === "Enter") submitMitraAuth(); });
  }
}

// wire up the login/daftar form fields (rebuilt each render)
function wireAuthInputs(){
  // catatan: sama seperti di atas — tanpa render() ulang supaya ngetik di HP mulus,
  // tidak lag/ke-skip, dan keyboard tidak menutup sendiri.
  const an = el("authName");
  if (an) an.addEventListener("input", e => { state.auth.name = e.target.value; });
  const ae = el("authEmail");
  if (ae) ae.addEventListener("input", e => { state.auth.email = e.target.value; });
  const ap = el("authPassword");
  if (ap){
    ap.addEventListener("input", e => { state.auth.password = e.target.value; });
    ap.addEventListener("keydown", e => { if (e.key === "Enter") submitAuth(); });
  }
}

// keep caret/focus on the search field across re-renders
function preserveFocus(id){
  requestAnimationFrame(()=>{
    const node = el(id);
    if (node){ node.focus(); node.selectionStart = node.selectionEnd = node.value.length; }
  });
}

/* ---------------- live countdown tick (1x/detik) ---------------- */
function updateCountdownUI(){
  DEALS.concat(state.liveDeals).forEach(d=>{
    // kalau waktu habis, mulai siklus "harga naik" berikutnya (demo loop)
    if (timeLeftMs(d) <= 0){
      d.endsAt = Date.now() + (4 + Math.random()*10) * 60000;
    }
    const label = urgencyLabel(d);
    const hot = isHot(d);
    const cp = currentPrice(d);

    // badge + harga di kartu daftar
    const badge = el(`urg-${d.id}`);
    if (badge){
      badge.classList.toggle("hot", hot);
      badge.innerHTML = `${ICONS.bolt} Harga naik lagi dalam ${label}`;
    }
    const priceEl = el(`price-${d.id}`);
    if (priceEl && priceEl.dataset.price !== String(cp)){
      priceEl.textContent = rp(cp);
      priceEl.dataset.price = cp;
      priceEl.classList.remove("price-drop-flash");
      void priceEl.offsetWidth; // restart animasi
      priceEl.classList.add("price-drop-flash");
    }

    // badge + harga di halaman detail (kalau sedang dibuka)
    if (state.view === "detail" && state.selected && state.selected.id === d.id){
      const badgeD = el(`urg-detail-${d.id}`);
      if (badgeD){
        badgeD.classList.toggle("hot", hot);
        badgeD.innerHTML = `${ICONS.bolt} Harga naik lagi dalam ${label}`;
      }
      const priceD = el(`price-detail-${d.id}`);
      if (priceD) priceD.textContent = rp(cp);
      const btn = document.querySelector('.btn.btn-green[onclick="addToCart()"]');
      if (btn && !isGuestUser()) btn.textContent = `Masukkan keranjang · ${rp(cp*state.qty)}`;
    }
  });

  // notifikasi urgensi pengambilan pesanan (kalau halaman Pesananku sedang dibuka)
  if (state.tab === "orders"){
    state.orders.forEach(o=>{
      (o.pickups||[]).forEach(p=>{
        if (!p.deadlineAt) return;
        const badge = el(`pickup-urg-${p.code}`);
        if (!badge) return;
        const urg = pickupUrgencyInfo(p.deadlineAt);
        badge.className = `pickup-urgency ${urg.cls}`;
        badge.innerHTML = `${ICONS.clock} ${urg.text}`;
      });
    });
  }

  // countdown kedaluwarsa QR pembayaran
  if (state.view === "qr" || state.view === "va"){
    if (paymentTimeLeftMs() <= 0){
      if (state.view === "qr") regenerateQR();
      else selectBankVA(state.selectedBankVA); // buat ulang nomor VA yang baru begitu kedaluwarsa
      render();
    } else {
      const t = el("qr-timer");
      if (t) t.textContent = paymentTimeLabel();
    }
  }
}
setInterval(updateCountdownUI, 1000);

}

/* efek mengetik (typewriter) untuk judul dashboard */
function typeWrite(){
  const els = [...document.querySelectorAll("[data-type]")];
  if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  let delay = 250;
  els.forEach(e => {
    const t = e.dataset.type; e.textContent = "";
    setTimeout(() => {
      e.classList.add("typing"); let i = 0;
      const iv = setInterval(() => {
        e.textContent = t.slice(0, ++i);
        if (i >= t.length){ clearInterval(iv); setTimeout(() => e.classList.remove("typing"), 1400); }
      }, 45);
    }, delay);
    delay += t.length * 45 + 300;
  });
}
let _animKey = "", _lastCartCount = 0, _promoPause = 0;

function burstConfetti(){
  const colors = ["#F47B4A","#F6C667","#4CAF7A","#0F5D4E","#8B5E3C"];
  for (let i = 0; i < 36; i++){
    const b = document.createElement("i");
    b.className = "confetti-bit";
    b.style.left = (Math.random()*100) + "vw";
    b.style.background = colors[i % colors.length];
    b.style.setProperty("--dx", (Math.random()*160 - 80) + "px");
    b.style.setProperty("--rot", (Math.random()*720 - 360) + "deg");
    b.style.setProperty("--dur", (1.6 + Math.random()*1.4) + "s");
    b.style.animationDelay = (Math.random()*.5) + "s";
    document.body.appendChild(b);
    setTimeout(() => b.remove(), 3800);
  }
}

// dipanggil tiap render: animasi masuk hanya saat pindah layar / ganti filter
function postRender(){
  const key = [state.role, state.tab, state.view, state.profileSub, state.activeCat, state.priceFilter, state.sortMode, state.mapMode, state.locationEnabled, state.umkmTab, state.umkmTierView].join("|");
  const c = document.querySelector(".content");
  if (c && key !== _animKey){
    c.classList.add("anim");
    if (state.view === "success") burstConfetti();
    if (document.querySelector("[data-type]")) typeWrite();
  }
  _animKey = key;
  const count = state.cart.reduce((s, x) => s + x.qty, 0);
  const badge = document.querySelector(".cart-badge");
  if (badge && count !== _lastCartCount) badge.classList.add("bump");
  _lastCartCount = count;
}

// carousel promo bergeser otomatis, berhenti sebentar kalau pengguna menyentuh
document.addEventListener("pointerdown", () => { _promoPause = Date.now(); }, true);
setInterval(() => {
  const row = document.querySelector(".promo-row");
  if (!row || Date.now() - _promoPause < 6000) return;
  const card = row.querySelector(".promo-card");
  if (!card) return;
  const step = card.offsetWidth + 10;
  row.scrollLeft + row.clientWidth >= row.scrollWidth - 8 ? row.scrollTo({left:0}) : row.scrollBy({left:step});
}, 3800);

document.addEventListener("error", e => {
  const t = e.target;
  if (t && t.tagName === "IMG" && !t.dataset.fb){ t.dataset.fb = "1"; t.src = IMG_FALLBACK; }
}, true);
